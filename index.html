<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Virtual Flower Experience</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- MediaPipe Tasks Vision / Hands Engine -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div class="art-container">
        <!-- Background Ambient Glassmorphism -->
        <div class="ambient-glow"></div>
        <div class="vignette"></div>

        <!-- Camera Container -->
        <div class="camera-wrapper">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
        </div>

        <!-- Glassmorphism Overlay HUD Minimalis -->
        <div class="hud-overlay">
            <div class="hud-status">
                <span class="pulse-dot"></span>
                <span>VIRTUAL BOTANICAL ART</span>
            </div>
            <div id="fps-counter" class="fps-badge">FPS: 60</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
