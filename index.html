<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLOWER BY RZ PROJECT</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- MediaPipe Tasks Vision / Hands Engine -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <!-- START SCREEN / LANDING PAGE -->
    <div id="start-screen" class="start-screen">
        <div class="landing-card">
            <div class="heart-icon-header">💖</div>
            <h1 class="glow-title">FLOWER BY RZ PROJECT</h1>
            <p class="subtitle">Interactive Virtual Botanical Experience</p>
            <button id="start-btn" class="glow-button">
                <span>OPEN CAMERA</span>
            </button>
        </div>
    </div>

    <!-- MAIN ARTROOM APP CONTAINER -->
    <div class="art-container">
        <!-- Ambient Background Glow & Hearts -->
        <div class="ambient-glow"></div>
        <div class="vignette"></div>

        <!-- CAMERA WRAPPER WITH PINK GLOW FRAME -->
        <div class="camera-frame-container">
            <div class="pink-glow-border"></div>
            <div class="camera-wrapper">
                <video id="video" playsinline></video>
                <canvas id="canvas"></canvas>
            </div>
        </div>

        <!-- Glassmorphism Status Bar -->
        <div class="hud-overlay">
            <div class="hud-status">
                <span class="pulse-dot"></span>
                <span>FLOWER BY RZ PROJECT</span>
            </div>
            <div id="fps-counter" class="fps-badge">FPS: --</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
